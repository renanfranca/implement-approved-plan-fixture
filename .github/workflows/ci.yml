name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "pilot-base/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --silent --fail http://localhost:9000/api/system/status | grep --quiet '\"status\":\"UP\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify with Maven
        run: ./mvnw --batch-mode clean verify

      - name: Analyze baseline and candidate with SonarQube
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SONAR_HOST_URL: http://localhost:9000
        run: ./scripts/sonar-quality-gate.sh "$BASE_SHA"

